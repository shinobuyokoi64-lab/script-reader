<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>台本リーダー</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #232736;
      --border: #2d3148;
      --accent: #4e7df4;
      --accent-dim: rgba(78,125,244,0.12);
      --highlight: rgba(78,125,244,0.25);
      --text: #e2e6f0;
      --muted: #5c637a;
      --green: #3ecf8e;
      --player-h: 130px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      min-height: 100dvh;
    }

    /* ── Screen switching ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ═══════════════════════════════
       INPUT SCREEN
    ═══════════════════════════════ */
    #inputScreen { padding-bottom: 40px; }

    .top-bar {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .top-bar h1 { font-size: 17px; font-weight: 700; }
    .top-bar .icon { font-size: 20px; }

    .input-card {
      margin: 16px;
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 14px;
    }
    textarea {
      width: 100%;
      height: 130px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.7;
      resize: none;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .row select { flex: 1; min-width: 140px; }
    select {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      height: 44px;
    }
    .btn {
      flex: 1;
      height: 44px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.45; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* progress */
    .prog-wrap { margin-top: 10px; display: none; }
    .prog-track { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.4s; }
    .status { font-size: 12px; color: var(--muted); margin-top: 6px; }

    /* saved sessions */
    .section-title {
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      color: var(--muted); text-transform: uppercase;
      padding: 20px 20px 8px;
    }
    .saved-list { display: flex; flex-direction: column; gap: 6px; padding: 0 16px; }
    .saved-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .saved-card:active { background: var(--card); }
    .saved-info { flex: 1; min-width: 0; }
    .saved-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .saved-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .saved-del { color: var(--muted); font-size: 18px; padding: 4px 6px; cursor: pointer; }
    .empty-saved { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }

    /* ═══════════════════════════════
       PLAYER SCREEN
    ═══════════════════════════════ */
    #playerScreen { padding-bottom: calc(var(--player-h) + var(--safe-b) + 8px); }

    .player-top {
      position: sticky;
      top: 0; z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 15px;
      cursor: pointer;
      padding: 4px 8px 4px 0;
    }
    .session-title { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .save-btn {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .save-btn.saved { background: rgba(62,207,142,0.12); border-color: var(--green); color: var(--green); }

    /* total bar */
    .total-bar {
      margin: 12px 16px 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    .total-bar .label { color: var(--muted); }
    .total-bar .val { color: var(--accent); font-weight: 700; }

    /* chapter list */
    .chapter-list { padding: 4px 16px 0; display: flex; flex-direction: column; gap: 6px; }

    .ch-wrap { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .ch-wrap.active-ch { border-color: var(--accent); }

    .ch-header {
      background: var(--surface);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .ch-wrap.active-ch .ch-header { background: var(--card); }

    .ch-num {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      cursor: pointer;
    }
    .ch-wrap.active-ch .ch-num { background: var(--accent); color: #fff; }

    .ch-info { flex: 1; min-width: 0; }
    .ch-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch-dur { font-size: 11px; color: var(--accent); margin-top: 2px; font-weight: 600; }

    .ch-play {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      color: #fff;
      flex-shrink: 0;
    }

    /* script drawer */
    .ch-drawer {
      display: none;
      background: var(--card);
      border-top: 1px solid var(--border);
      max-height: 280px;
      overflow-y: auto;
      padding: 12px 14px;
      -webkit-overflow-scrolling: touch;
    }
    .ch-drawer.open { display: block; }
    .script-line {
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
      padding: 3px 6px;
      border-radius: 4px;
      margin-bottom: 2px;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
    }
    .script-line:active { background: rgba(255,255,255,0.08); }
    .script-line.current {
      background: var(--highlight);
      color: var(--text);
    }

    /* ── Bottom Player ── */
    .player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(16px + var(--safe-b));
      z-index: 50;
      display: none;
    }
    .player.visible { display: block; }

    .now-playing {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-playing strong { color: var(--text); }

    .player-controls { display: flex; align-items: center; gap: 8px; }

    .p-btn {
      background: none; border: none;
      color: var(--text);
      font-size: 22px; cursor: pointer;
      padding: 4px; opacity: 0.8;
      line-height: 1;
    }
    .p-pp {
      width: 44px; height: 44px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff;
      flex-shrink: 0; cursor: pointer;
      border: none;
    }

    .p-progress { flex: 1; }
    .seek {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 22px;
      background: transparent;
      cursor: pointer; outline: none;
      margin: 0;
    }
    .seek::-webkit-slider-runnable-track {
      height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.12);
    }
    .seek::-moz-range-track {
      height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.12);
    }
    .seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      margin-top: -8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .seek::-moz-range-thumb {
      width: 20px; height: 20px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
    }
    .time-row {
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--muted); margin-top: 4px;
    }

    .speed-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 11px; font-weight: 700;
      padding: 5px 8px;
      cursor: pointer; white-space: nowrap;
    }

    audio { display: none; }
  </style>
</head>
<body>

<!-- ═══════════ INPUT SCREEN ═══════════ -->
<div id="inputScreen" class="screen active">
  <div class="top-bar">
    <span class="icon">📖</span>
    <h1>台本リーダー</h1>
  </div>

  <div class="input-card">
    <textarea id="scriptText" placeholder="台本テキストをここに貼り付けてください。&#10;「Section 01 …」で始まる行がチャプターになります。"></textarea>
    <div class="row">
      <select id="voiceSelect" onchange="previewVoice(true)">
        <option value="nanami">女性 (Nanami) — 標準</option>
        <option value="nanami_soft">女性 (Nanami) — 落ち着き</option>
        <option value="nanami_bright">女性 (Nanami) — 明るい</option>
        <option value="keita">男性 (Keita) — 標準</option>
        <option value="keita_low">男性 (Keita) — 低め</option>
        <option value="keita_bright">男性 (Keita) — 明るい</option>
      </select>
      <button class="btn-outline btn" id="previewBtn" onclick="previewVoice()" style="flex:0 0 auto; width:auto; padding:0 14px;">🔊 試聴</button>
      <button class="btn" id="convertBtn" onclick="startConvert()">▶ 変換する</button>
    </div>
    <div class="prog-wrap" id="progWrap">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="status" id="statusText"></div>
    </div>
  </div>

  <div id="savedSection" style="display:none">
    <div class="section-title">保存済みセッション</div>
    <div class="saved-list" id="savedList"></div>
  </div>
</div>

<!-- ═══════════ PLAYER SCREEN ═══════════ -->
<div id="playerScreen" class="screen">
  <div class="player-top">
    <button class="back-btn" onclick="goBack()">← 戻る</button>
    <div class="session-title" id="sessionTitle">—</div>
    <button class="save-btn" id="dlBtn" onclick="downloadMp3()">⬇ MP3</button>
    <button class="save-btn" id="saveBtn" onclick="saveSession()">💾 保存</button>
  </div>

  <div class="total-bar" id="totalBar" style="display:none">
    <span class="label">合計時間</span>
    <span class="val" id="totalTime">—</span>
  </div>

  <div class="chapter-list" id="chapterList"></div>
</div>

<!-- ═══════════ BOTTOM PLAYER ═══════════ -->
<div class="player" id="player">
  <div class="now-playing">再生中: <strong id="nowTitle">—</strong></div>
  <div class="player-controls">
    <button class="p-btn" onclick="prevChapter()">⏮</button>
    <button class="p-pp" id="ppBtn" onclick="togglePlay()">▶</button>
    <button class="p-btn" onclick="nextChapter()">⏭</button>
    <div class="p-progress">
      <input type="range" class="seek" id="seekBar" value="0" min="0" max="100" step="0.1" oninput="seekTo(this.value)">
      <div class="time-row">
        <span id="curTime">0:00</span>
        <span id="durTime">—</span>
      </div>
    </div>
    <button class="speed-btn" id="speedBtn" onclick="cycleSpeed()">1.0×</button>
  </div>
</div>

<audio id="audioEl"></audio>

<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
const audio = document.getElementById('audioEl');
let chapters = [];          // [{title, text, duration, audio_url, audioBlob?}]
let currentIdx = -1;
let totalSec = 0;
let sessionKey = '';        // hash key for IndexedDB
let isSaved = false;

const SPEEDS = [0.75, 1.0, 1.25, 1.5, 2.0];
let speedIdx = 1;

// Per-chapter: array of lines for script view
let chapterLines = [];      // [{text, startFrac}] per chapter

/* ═══════════════════════════════════════
   INDEXEDDB
═══════════════════════════════════════ */
const DB = (() => {
  let db = null;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('ScriptReaderDB', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('sessions')) {
        d.createObjectStore('sessions', { keyPath: 'key' });
      }
    };
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = e => rej(e.target.error);
  });
  const tx = (mode) => db.transaction('sessions', mode).objectStore('sessions');
  const get = key => new Promise((res, rej) => {
    const r = tx('readonly').get(key);
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
  const getAll = () => new Promise((res, rej) => {
    const r = tx('readonly').getAll();
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
  const put = val => new Promise((res, rej) => {
    const t = db.transaction('sessions', 'readwrite');
    t.objectStore('sessions').put(val);
    t.oncomplete = () => res();
    t.onerror = e => rej(e.target.error);
  });
  const del = key => new Promise((res, rej) => {
    const t = db.transaction('sessions', 'readwrite');
    t.objectStore('sessions').delete(key);
    t.oncomplete = () => res();
    t.onerror = e => rej(e.target.error);
  });
  return { open, get, getAll, put, del };
})();

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < Math.min(s.length, 2000); i++) {
    h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  }
  return h.toString(36);
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
DB.open().then(() => loadSavedList()).catch(() => {});

async function loadSavedList() {
  const all = await DB.getAll();
  const sect = document.getElementById('savedSection');
  const list = document.getElementById('savedList');
  if (!all || all.length === 0) { sect.style.display = 'none'; return; }
  sect.style.display = 'block';
  list.innerHTML = '';
  all.sort((a, b) => b.savedAt - a.savedAt).forEach(s => {
    const d = document.createElement('div');
    d.className = 'saved-card';
    d.innerHTML = `
      <div class="saved-info">
        <div class="saved-name">${esc(s.label)}</div>
        <div class="saved-meta">${s.chapters.length}チャプター · ${fmtDur(s.totalSec)} · ${new Date(s.savedAt).toLocaleDateString('ja-JP')}</div>
      </div>
      <div class="saved-del" onclick="event.stopPropagation();renameSession('${s.key}')" title="名前を変更">✏️</div>
      <div class="saved-del" onclick="event.stopPropagation();deleteSession('${s.key}')">🗑</div>`;
    d.onclick = () => loadSavedSession(s);
    list.appendChild(d);
  });
}

/* ═══════════════════════════════════════
   VOICE PREVIEW (その場で試聴)
═══════════════════════════════════════ */
let previewAudio = null;

function stopPreview() {
  if (previewAudio) { previewAudio.pause(); previewAudio = null; }
  document.getElementById('previewBtn').textContent = '🔊 試聴';
}

function previewVoice(fromSelect) {
  const btn = document.getElementById('previewBtn');
  // 再生中にボタンを押したら停止（トグル）。音声切替時は止めて鳴らし直す。
  if (previewAudio) {
    stopPreview();
    if (!fromSelect) return;
  }
  const v = document.getElementById('voiceSelect').value;
  btn.textContent = '⏳ 生成中';
  previewAudio = new Audio('/api/preview/' + v);
  previewAudio.playbackRate = SPEEDS[speedIdx];
  previewAudio.onplaying = () => { btn.textContent = '⏹ 停止'; };
  previewAudio.onended = () => { stopPreview(); };
  previewAudio.onerror = () => { stopPreview(); };
  previewAudio.play().catch(() => { stopPreview(); });
}

/* ═══════════════════════════════════════
   CONVERT
═══════════════════════════════════════ */
async function startConvert() {
  const text = document.getElementById('scriptText').value.trim();
  if (!text) { alert('テキストを入力してください'); return; }
  const voice = document.getElementById('voiceSelect').value;

  // Check cache
  const key = hashStr(text + voice);
  sessionKey = key;
  try {
    const cached = await DB.get(key);
    if (cached && cached.chapters && cached.chapters.length > 0) {
      if (confirm('保存済みのデータがあります。そちらを読み込みますか？\n（いいえ：再変換）')) {
        loadSavedSession(cached);
        return;
      }
    }
  } catch(e) {}

  const btn = document.getElementById('convertBtn');
  const progWrap = document.getElementById('progWrap');
  const fill = document.getElementById('progFill');
  const status = document.getElementById('statusText');

  btn.disabled = true;
  progWrap.style.display = 'block';
  fill.style.width = '0%';
  status.textContent = '台本を解析中…';

  chapters = [];
  chapterLines = [];
  totalSec = 0;
  isSaved = false;

  // Switch to player screen
  document.getElementById('inputScreen').classList.remove('active');
  document.getElementById('playerScreen').classList.add('active');
  document.getElementById('sessionTitle').textContent = text.slice(0, 30) + (text.length > 30 ? '…' : '');
  document.getElementById('chapterList').innerHTML = '';
  document.getElementById('totalBar').style.display = 'none';
  document.getElementById('saveBtn').className = 'save-btn';
  document.getElementById('saveBtn').textContent = '💾 保存';

  // Move progress to player top area
  document.querySelector('.player-top').after(progWrap);
  progWrap.style.display = 'block';

  try {
    const res = await fetch('/api/convert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, voice }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || 'エラー');

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', total = 0, done = 0;

    while (true) {
      const { value, done: streamDone } = await reader.read();
      if (streamDone) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n');
      buf = parts.pop();
      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        let d; try { d = JSON.parse(part.slice(6)); } catch { continue; }
        if (d.type === 'start') {
          total = d.total;
          status.textContent = `音声生成中… 0/${total}`;
        } else if (d.type === 'chapter') {
          done++;
          chapters.push(d);
          chapterLines.push(buildLines(d.text));
          totalSec += (d.duration || 0);
          renderChapter(d, done - 1);
          fill.style.width = `${(done / total) * 100}%`;
          status.textContent = `音声生成中… ${done}/${total}`;
          document.getElementById('totalBar').style.display = 'flex';
          document.getElementById('totalTime').textContent = fmtDur(totalSec);
        } else if (d.type === 'done') {
          status.textContent = `✓ 完了`;
          prefetchAudio();
          setTimeout(() => { progWrap.style.display = 'none'; }, 1500);
        } else if (d.type === 'error') {
          throw new Error(d.message);
        }
      }
    }
  } catch(e) {
    status.className = 'status'; status.style.color = '#e05b6e';
    status.textContent = `エラー: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}

/* ═══════════════════════════════════════
   PREFETCH AUDIO → BLOB
   サーバー一時ファイルはRenderスリープで消えるため
   変換直後に全音声をブラウザ内Blobへ取り込む
═══════════════════════════════════════ */
async function prefetchAudio() {
  await Promise.all(chapters.map(async ch => {
    if (ch.audioBlob || ch.blobUrl || !ch.audio_url) return;
    try {
      const res = await fetch(ch.audio_url);
      if (!res.ok) return;
      const blob = await res.blob();
      ch.audioBlob = blob;
      ch.blobUrl = URL.createObjectURL(blob);
      // 再生中チャプターのソースが期限切れURLなら差し替え
      if (currentIdx >= 0 && chapters[currentIdx] === ch && audio.src.indexOf('/api/audio/') !== -1) {
        const t = audio.currentTime, wasPlaying = !audio.paused;
        audio.src = ch.blobUrl;
        audio.currentTime = t;
        if (wasPlaying) audio.play();
      }
    } catch (e) {}
  }));
}

/* ═══════════════════════════════════════
   RENDER CHAPTER CARD
═══════════════════════════════════════ */
function renderChapter(ch, idx) {
  const lines = chapterLines[idx];
  const lineHtml = lines.map((l, li) =>
    `<p class="script-line" id="line-${idx}-${li}" onclick="seekToLine(${idx},${li})">${esc(l.text)}</p>`
  ).join('');

  const wrap = document.createElement('div');
  wrap.className = 'ch-wrap';
  wrap.id = `wrap-${idx}`;
  wrap.innerHTML = `
    <div class="ch-header" onclick="playChapter(${idx})">
      <div class="ch-num" onclick="event.stopPropagation(); toggleDrawer(${idx})" title="台本を表示">${idx + 1}</div>
      <div class="ch-info">
        <div class="ch-title">${esc(shortTitle(ch.title))}</div>
        <div class="ch-dur">${ch.duration != null ? fmtDur(ch.duration) : ''}</div>
      </div>
      <div class="ch-play">▶</div>
    </div>
    <div class="ch-drawer" id="drawer-${idx}">
      ${lineHtml}
    </div>`;
  document.getElementById('chapterList').appendChild(wrap);
}

/* ═══════════════════════════════════════
   SCRIPT DRAWER
═══════════════════════════════════════ */
function toggleDrawer(idx) {
  const drawer = document.getElementById(`drawer-${idx}`);
  drawer.classList.toggle('open');
}

function openDrawer(idx) {
  document.getElementById(`drawer-${idx}`)?.classList.add('open');
}

/* ═══════════════════════════════════════
   LINE BUILDING & HIGHLIGHTING
═══════════════════════════════════════ */
function buildLines(text) {
  const raw = text.split('\n').filter(l => l.trim());
  const total = raw.reduce((s, l) => s + l.length, 0);
  let cum = 0;
  return raw.map(line => {
    const startFrac = total > 0 ? cum / total : 0;
    cum += line.length;
    return { text: line, startFrac };
  });
}

let highlightTimer = null;
function startHighlighting(idx) {
  stopHighlighting();
  openDrawer(idx);
  highlightTimer = setInterval(() => {
    if (!audio.duration) return;
    const progress = audio.currentTime / audio.duration;
    const lines = chapterLines[idx];
    if (!lines) return;
    // Find current line
    let cur = 0;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startFrac <= progress) cur = i;
    }
    // Update highlight
    document.querySelectorAll(`#drawer-${idx} .script-line`).forEach((el, i) => {
      const isCur = i === cur;
      el.classList.toggle('current', isCur);
      if (isCur) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }, 500);
}

function stopHighlighting() {
  if (highlightTimer) { clearInterval(highlightTimer); highlightTimer = null; }
  document.querySelectorAll('.script-line.current').forEach(el => el.classList.remove('current'));
}

/* ═══════════════════════════════════════
   SEEK TO LINE (tap/click a script line)
═══════════════════════════════════════ */
function seekToLine(chIdx, lineIdx) {
  const frac = chapterLines[chIdx][lineIdx].startFrac;
  if (currentIdx !== chIdx) {
    playChapter(chIdx);
    const doSeek = () => {
      if (audio.duration) {
        audio.currentTime = frac * audio.duration;
        audio.removeEventListener('timeupdate', doSeek);
      }
    };
    audio.addEventListener('timeupdate', doSeek);
  } else {
    if (audio.duration) audio.currentTime = frac * audio.duration;
  }
}

/* ═══════════════════════════════════════
   PLAYBACK
═══════════════════════════════════════ */
function playChapter(idx) {
  if (idx < 0 || idx >= chapters.length) return;
  stopHighlighting();
  document.querySelectorAll('.ch-wrap').forEach((el, i) => el.classList.toggle('active-ch', i === idx));
  currentIdx = idx;
  const ch = chapters[idx];
  document.getElementById('nowTitle').textContent = shortTitle(ch.title);
  audio.src = ch.blobUrl || ch.audio_url;
  audio.playbackRate = SPEEDS[speedIdx];
  audio.play();
  document.getElementById('player').classList.add('visible');
  document.getElementById('ppBtn').textContent = '⏸';
  startHighlighting(idx);
  document.getElementById(`wrap-${idx}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function togglePlay() {
  if (audio.paused) audio.play();
  else audio.pause();
}
function prevChapter() { if (currentIdx > 0) playChapter(currentIdx - 1); }
function nextChapter() { if (currentIdx < chapters.length - 1) playChapter(currentIdx + 1); }
function seekTo(v) { if (audio.duration) audio.currentTime = (v / 100) * audio.duration; }
function cycleSpeed() {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speedIdx];
  document.getElementById('speedBtn').textContent = `${SPEEDS[speedIdx]}×`;
}

audio.addEventListener('play', () => { document.getElementById('ppBtn').textContent = '⏸'; });
audio.addEventListener('pause', () => { document.getElementById('ppBtn').textContent = '▶'; });
audio.addEventListener('ended', () => {
  stopHighlighting();
  document.getElementById('ppBtn').textContent = '▶';
  if (currentIdx < chapters.length - 1) setTimeout(() => playChapter(currentIdx + 1), 600);
});
audio.addEventListener('error', () => {
  const ch = chapters[currentIdx];
  if (!ch) return;
  // Blobがあれば差し替えて再試行
  if (ch.blobUrl && audio.src !== ch.blobUrl) {
    audio.src = ch.blobUrl;
    audio.play().catch(() => {});
  } else if (ch.audio_url) {
    // サーバー一時ファイル消失 → 取り直しを試みる
    fetch(ch.audio_url).then(res => {
      if (!res.ok) throw 0;
      return res.blob();
    }).then(blob => {
      ch.audioBlob = blob;
      ch.blobUrl = URL.createObjectURL(blob);
      audio.src = ch.blobUrl;
      audio.play().catch(() => {});
    }).catch(() => {
      document.getElementById('nowTitle').textContent = '⚠ 音声を再取得できません（再変換してください）';
    });
  }
});
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const p = (audio.currentTime / audio.duration) * 100;
  document.getElementById('seekBar').value = p;
  document.getElementById('curTime').textContent = fmt(audio.currentTime);
  document.getElementById('durTime').textContent = fmt(audio.duration);
});

/* ═══════════════════════════════════════
   SAVE / LOAD SESSION
═══════════════════════════════════════ */
async function saveSession() {
  if (chapters.length === 0) return;
  const defLabel = document.getElementById('sessionTitle').textContent.replace(/…$/, '')
    || document.getElementById('scriptText').value.trim().slice(0, 40) || 'セッション';
  const name = prompt('保存する名前を入力してください', defLabel);
  if (name === null) return;          // キャンセル
  const label = name.trim() || defLabel;
  const btn = document.getElementById('saveBtn');
  btn.textContent = '保存中…';
  try {
    // Download audio blobs
    const chaptersWithBlobs = await Promise.all(chapters.map(async ch => {
      if (ch.audioBlob) return ch;
      const res = await fetch(ch.audio_url);
      const blob = await res.blob();
      ch.audioBlob = blob;
      ch.blobUrl = URL.createObjectURL(blob);
      return ch;
    }));

    await DB.put({
      key: sessionKey,
      label,
      savedAt: Date.now(),
      totalSec,
      voice: document.getElementById('voiceSelect').value,
      chapters: chaptersWithBlobs.map(ch => ({
        title: ch.title,
        text: ch.text,
        duration: ch.duration,
        audioBlob: ch.audioBlob,
      })),
    });
    isSaved = true;
    document.getElementById('sessionTitle').textContent = label;
    btn.className = 'save-btn saved';
    btn.textContent = '✓ 保存済み';
  } catch(e) {
    btn.textContent = '💾 保存';
    alert('保存に失敗しました: ' + e.message);
  }
}

/* ═══════════════════════════════════════
   DOWNLOAD AS MP3 FILE
   全チャプターを1つのMP3に結合してダウンロード
═══════════════════════════════════════ */
async function downloadMp3() {
  if (chapters.length === 0) return;
  const btn = document.getElementById('dlBtn');
  const orig = btn.textContent;
  btn.textContent = '準備中…';
  try {
    // 全チャプターのBlobを確保
    const blobs = await Promise.all(chapters.map(async ch => {
      if (ch.audioBlob) return ch.audioBlob;
      const src = ch.blobUrl || ch.audio_url;
      const res = await fetch(src);
      if (!res.ok) throw new Error('音声を取得できません');
      const blob = await res.blob();
      ch.audioBlob = blob;
      ch.blobUrl = URL.createObjectURL(blob);
      return blob;
    }));

    // MP3フレームを連結（プレイヤーは連続再生可能）
    const merged = new Blob(blobs, { type: 'audio/mpeg' });
    const url = URL.createObjectURL(merged);
    const name = (document.getElementById('sessionTitle').textContent || '台本')
      .replace(/[\\/:*?"<>|…]/g, '').trim().slice(0, 50) || '台本';
    const a = document.createElement('a');
    a.href = url;
    a.download = name + '.mp3';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    btn.textContent = '✓ 保存';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  } catch (e) {
    btn.textContent = orig;
    alert('ダウンロードに失敗しました: ' + e.message);
  }
}

function loadSavedSession(s) {
  chapters = s.chapters.map(ch => ({
    ...ch,
    blobUrl: URL.createObjectURL(ch.audioBlob),
    audio_url: '',
  }));
  chapterLines = chapters.map(ch => buildLines(ch.text));
  totalSec = s.totalSec;
  sessionKey = s.key;
  isSaved = true;

  // Switch screen
  document.getElementById('inputScreen').classList.remove('active');
  document.getElementById('playerScreen').classList.add('active');
  document.getElementById('sessionTitle').textContent = s.label;
  document.getElementById('saveBtn').className = 'save-btn saved';
  document.getElementById('saveBtn').textContent = '✓ 保存済み';

  // Render
  document.getElementById('chapterList').innerHTML = '';
  chapters.forEach((ch, i) => renderChapter(ch, i));
  document.getElementById('totalBar').style.display = 'flex';
  document.getElementById('totalTime').textContent = fmtDur(totalSec);
  document.getElementById('player').classList.remove('visible');
}

async function deleteSession(key) {
  if (!confirm('このセッションを削除しますか？')) return;
  await DB.del(key);
  loadSavedList();
}

async function renameSession(key) {
  const s = await DB.get(key);
  if (!s) return;
  const name = prompt('新しい名前を入力してください', s.label);
  if (name === null) return;
  const newLabel = name.trim();
  if (!newLabel || newLabel === s.label) return;
  s.label = newLabel;
  await DB.put(s);
  if (sessionKey === key) document.getElementById('sessionTitle').textContent = newLabel;
  loadSavedList();
}

/* ═══════════════════════════════════════
   DYNAMIC BOTTOM PADDING (iPhone fix)
═══════════════════════════════════════ */
const playerEl = document.getElementById('player');
const playerScreenEl = document.getElementById('playerScreen');

function updatePlayerPadding() {
  if (playerEl.classList.contains('visible')) {
    playerScreenEl.style.paddingBottom = (playerEl.offsetHeight + 8) + 'px';
  } else {
    playerScreenEl.style.paddingBottom = '';
  }
}

new ResizeObserver(updatePlayerPadding).observe(playerEl);

/* ═══════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════ */
function goBack() {
  audio.pause();
  stopHighlighting();
  document.getElementById('playerScreen').classList.remove('active');
  document.getElementById('inputScreen').classList.add('active');
  document.getElementById('player').classList.remove('visible');
  loadSavedList();
}

/* ═══════════════════════════════════════
   UTILS
═══════════════════════════════════════ */
function fmtDur(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}分${String(s).padStart(2, '0')}秒`;
}
function fmt(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}
function shortTitle(t) { return t.length > 28 ? t.slice(0, 28) + '…' : t; }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
